{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmer la suppression du livre</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <section class="livres-section">
        <h2>Confirmer la suppression du livre</h2>
        <p>Êtes-vous sûr de vouloir supprimer le livre "{{ livre.titre }}" ?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Supprimer</button>
            <a href="{% url 'liste_livre' %}">Annuler</a>
        </form>
    </section>
</body>
</html>
